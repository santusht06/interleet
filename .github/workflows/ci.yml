name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend-syntax:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all backend sources
        # Byte-compiles every module without importing (no deps/DB needed) — a fast
        # gate that catches syntax errors before they reach production.
        run: python -m compileall -q backend/app backend/main.py

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build (no prerender)
        working-directory: frontend
        run: npm run build:no-prerender
